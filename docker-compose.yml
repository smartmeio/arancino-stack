############################################################
#                                                          #
# docker-compose.yml for Arancino Ecosystem (Alpine Linux) #
#                                                          #
############################################################

version: '3.7'
services:
  redis:
    restart: always
    image: smartmeio/arancino-redis:latest
    volumes:
      - "redis-data:/var/lib/redis/data/"
    networks:
      - "arancino_net"

  daemon:
    restart: always
    privileged: true
    image: smartmeio/arancino-daemon:2.7.5-beta.2-alpine
    environment:
      - REDIS_HOST_VOLATILE=redis
      - REDIS_HOST_PERSISTENT=redis
    volumes:
      - "arancino_conf:/etc/arancino/config"
      - "arancino_log:/var/log/arancino"
      - "/dev:/dev"
    depends_on:
      - redis
    ports:
      - ${ARPORT:-1475}:1475
    networks:
      - "arancino_net"

  interface:
    restart: always
    image: smartmeio/arancino-interface:1.2.0-beta.3-alpine
    environment:
      - REDIS_HOST_VOLATILE=redis
      - REDIS_HOST_PERSISTENT=redis
    volumes:
      - "arancino-interface_conf:/etc/arancino/config"
    depends_on:
      - redis
    ports:
      - ${ARINT:-5000}:5000
    networks:
      - "arancino_net"

  transmitter:
    restart: always
    image: smartmeio/arancino-transmitter:1.2.0-alpha.3-alpine
    command: arancino-transmitter
    environment:
      - REDIS_HOST_VOLATILE=redis
      - REDIS_HOST_PERSISTENT=redis
    volumes:
      - "arancino-transmitter_conf:/etc/arancino/config"
      - "arancino-transmitter_log:/var/log/arancino"
    depends_on:
      - redis
    networks:
      - "arancino_net"


  mosquitto:
    restart: always
    image: smartmeio/eclipse-mosquitto:1.0.0
    volumes:
      - "mosquitto_conf:/mosquitto/config"
      - "mosquitto_data:/mosquitto/data"
      - "mosquitto_log:/mosquitto/log"
    ports:
      - 127.0.0.1:${MPORT:-1883}:1883
      - 127.0.0.1:${MSPORT:-8883}:8883
      - 127.0.0.1:${MWSPORT:-9001}:9001
    networks:
      - "arancino_net"

  node-red:
    restart: always
    image: nodered/node-red:2.2.0-14
    volumes:
      - node_red_data:/data
    ports:
      - ${REDPORT:-1880}:1880
    networks:
      - "arancino_net"

  lrod:
    restart: always
    privileged: true
    image: smartmeio/lrod:0.5.0
    command: startLR
    volumes:
      - "lr_conf:/etc/iotronic"
      #- "lr_log:/var/log/iotronic"
      - "lr_var:/var/lib/iotronic"
      - "lr_nginx:/etc/nginx"
      - "lr_le:/etc/letsencrypt"
    network_mode: "host"


volumes:
  redis-data:
  arancino_conf:
  arancino_log:
  arancino-transmitter_conf:
  arancino-transmitter_log:
  arancino-interface_conf:
  node_red_data:
  mosquitto_conf:
  mosquitto_data:
  mosquitto_log:
  lr_conf:
  #lr_log:
  lr_var:
  lr_nginx:
  lr_le:


networks:
  arancino_net:
    driver: "bridge"
